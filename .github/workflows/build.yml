name: Build iOS Mod Menu

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'template/**'
      - 'Tweak.xm'
      - 'control'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dpkg ldid xz || true

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git
          cp -R sdks/iPhoneOS* $HOME/theos/sdks/ || true

      - name: Prepare Build Files
        run: |
          # Tweak.xm kokte degil template/ icindeyse koke kopyala
          if [ ! -f Tweak.xm ] && [ -f template/Tweak.xm ]; then
            cp template/Tweak.xm ./Tweak.xm
          fi
          ls -la Tweak.xm

          cat > control << 'EOF'
          Package: com.few1n.dreamroadmod
          Name: FEW1N Mod Menu
          Depends: mobilesubstrate, firmware (>= 14.0)
          Version: 87.0
          Architecture: iphoneos-arm64
          Description: FEW1N Mod Menu v87.0 - Gelismis Ozel Oda (31 Kisi, Ozel Harita Etiketi, Canli Harita & Isim Degistirme, TMPro Short Hex Renkler, Polis Cakar/Siren, Pop&Bangs, Kesici Ses Modu, Otomatik Korna, Canli Reklam Bozucu)
          Maintainer: few1n
          Author: few1n
          Section: Tweaks
          EOF

          cat > Makefile << 'EOF'
          TARGET := iphone:clang:latest:14.0
          ARCHS = arm64
          INSTALL_TARGET_PROCESSES = DreamRoadMultiplayer
          THEOS_PACKAGE_SCHEME = rootless

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = FEW1NMod

          FEW1NMod_FILES = Tweak.xm
          FEW1NMod_CFLAGS = -fobjc-arc -Wno-deprecated-declarations -Wno-unused-variable -Wno-unused-function -Wno-unused-but-set-variable -Wno-format-invalid-specifier
          FEW1NMod_FRAMEWORKS = UIKit Foundation QuartzCore CoreGraphics ImageIO PhotosUI
          FEW1NMod_LIBRARIES = substrate

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

          cat > FEW1NMod.plist << 'EOF'
          { Filter = { Bundles = ( "com.TenebryFox.DreamRoadMultiplayer" ); }; }
          EOF

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          make clean
          make package FINALPACKAGE=1

      - name: Rename Package
        run: |
          mkdir -p output
          cp packages/*.deb output/FEW1NMod_87.0_${{ github.run_number }}.deb

      - name: Extract dylib for sideloading
        run: |
          DYLIB=$(find .theos/obj -name "*.dylib" | head -1)
          if [ -z "$DYLIB" ]; then
            dpkg -x packages/*.deb extracted
            DYLIB=$(find extracted -name "*.dylib" | head -1)
          fi
          echo "dylib: $DYLIB"
          cp "$DYLIB" output/FEW1NMod.dylib
          ls -la output/

      - name: Upload .deb (jailbreak)
        uses: actions/upload-artifact@v4
        with:
          name: FEW1N-ModMenu-v87.0-deb-${{ github.run_number }}
          path: output/*.deb

      - name: Upload .dylib (sideload)
        uses: actions/upload-artifact@v4
        with:
          name: FEW1N-ModMenu-v87.0-dylib-${{ github.run_number }}
          path: output/FEW1NMod.dylib

      # ===== SILEO / ZEBRA REPO (GitHub Pages) =====
      # docs/ klasorune deb + Packages/Release yazar, gh-pages'i tetikler.
      # Sileo'da eklenecek URL: https://<kullanici>.github.io/<repo>/
      - name: Build Sileo repo (docs/)
        run: |
          mkdir -p docs/debs
          # En son .deb'i kopyala (stable ismiyle) + versiyonlu ismi ile
          cp output/*.deb docs/debs/
          # En son surumu "latest.deb" olarak da tut
          cp output/*.deb docs/debs/FEW1NMod_latest.deb

          # Packages index olustur
          cd docs
          dpkg-scanpackages -m debs > Packages
          gzip -9c Packages > Packages.gz
          bzip2 -kf Packages
          xz -kf Packages || true

          # Release dosyasi (Sileo/Zebra icin gerekli)
          cat > Release << EOF
          Origin: FEW1N Mod Menu Repo
          Label: FEW1N Repo
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm64
          Components: main
          Description: FEW1N Mod Menu otomatik guncelleme deposu
          EOF

          # Basit index.html (repo tanitim)
          cat > index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>FEW1N Mod Menu Repo</title>
          <style>body{font-family:-apple-system,sans-serif;max-width:600px;margin:40px auto;padding:20px;background:#0a0a0a;color:#fff}
          a{color:#ffd700}h1{color:#ffd700}pre{background:#1a1a1a;padding:12px;border-radius:8px;overflow:auto}</style></head>
          <body>
          <h1>🏎️ FEW1N Mod Menu</h1>
          <p>DreamRoad Multiplayer mod menu — otomatik guncellemeli Sileo repo.</p>
          <h3>Kurulum</h3>
          <p>Sileo/Zebra'da <b>Sources → Add</b> ve bu URL'yi yapistir:</p>
          <pre>https://few1n.github.io/iOS-Mod-Menu-Template-for-Theos/</pre>
          <p>Sonra <b>FEW1N Mod Menu</b>'yu kur. Her yeni surumde Sileo update goruntuler.</p>
          <p><a href="debs/FEW1NMod_latest.deb">Son .deb'i direkt indir</a></p>
          </body></html>
          HTMLEOF
          ls -la
          cd ..

      - name: Commit & push repo files
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions Bot"
          git add docs/
          git commit -m "Repo update: v87.0 build ${{ github.run_number }}" || echo "no changes"
          git push origin HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}